[project]
name = "rag-common"
version = "0.1.0"
description = "Shared settings, logging, HTTP helpers, index schema and API contracts"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162",
    "uvicorn[standard]>=0.54",
    "httpx>=0.28",
    "pydantic>=2.11",
    "pydantic-settings>=2.16",
    "cryptography>=44",
]

[project.optional-dependencies]
qdrant = ["qdrant-client==1.20.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_common"]

[dependency-groups]
dev = ["pytest>=8.4", "qdrant-client==1.20.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
