[project]
name = "rag"
version = "0.1.0"
description = "Hybrid retrieval, fusion, reranking, table planner and streamed cited answers"
requires-python = ">=3.12,<3.13"
dependencies = [
    "rag-common[qdrant]",
    "numpy>=2.3",
    "langgraph==1.2.18",
    "langchain-core==1.7.1",
    "langchain-openai==1.7.3",
    "tokenizers==0.23.3",
    "deepagents==0.7.28",
]

[dependency-groups]
dev = ["pytest>=8.4"]

[tool.uv.sources]
rag-common = { path = "../../libs/common", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
