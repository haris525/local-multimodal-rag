[project]
name = "models-svc"
version = "0.1.0"
description = "GPU service: Qwen3 text embeddings, Qwen3-VL image embeddings, Qwen3 reranking"
requires-python = ">=3.12,<3.13"
dependencies = [
    "rag-common",
    "torch==2.15.0",
    "torchvision>=0.29",
    "sentence-transformers==6.3.0",
    "transformers>=5.22",
    "accelerate>=1.10",
    "pillow>=13.0",
]

[dependency-groups]
dev = ["pytest>=8.4"]

[tool.uv.sources]
rag-common = { path = "../../libs/common", editable = true }
torch = { index = "pytorch-cu132", marker = "sys_platform != 'darwin'" }
torchvision = { index = "pytorch-cu132", marker = "sys_platform != 'darwin'" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/models_svc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
