[project]
name = "ingest"
version = "0.1.0"
description = "Upload, parse, chunk, describe, embed and index documents"
requires-python = ">=3.12,<3.13"
dependencies = [
    "rag-common[qdrant]",
    "docling==2.150.0",
    "torch==2.15.0",
    "torchvision>=0.29",
    "openpyxl>=3.1.5",
    "pandas>=3.1",
    "duckdb>=2.0",
    "pillow>=13.0",
    "charset-normalizer>=3.5",
    "tokenizers>=0.23",
    "python-multipart>=0.0.33",
]

[project.scripts]
ingest-worker = "ingest.worker:main"

[dependency-groups]
dev = ["pytest>=8.4"]

[tool.uv.sources]
rag-common = { path = "../../libs/common", editable = true }
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
