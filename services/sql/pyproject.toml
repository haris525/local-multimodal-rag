[project]
name = "sql-sandbox"
version = "0.1.0"
description = "Sandboxed read-only SQL over per-document DuckDB tables"
requires-python = ">=3.12,<3.13"
dependencies = ["rag-common", "duckdb>=2.0"]

[dependency-groups]
dev = ["pytest>=8.4", "pandas>=3.1"]

[tool.uv.sources]
rag-common = { path = "../../libs/common", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sql_sandbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
