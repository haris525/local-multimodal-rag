[project]
name = "threads"
version = "0.1.0"
description = "Conversations with running summaries, and long-term memories"
requires-python = ">=3.12,<3.13"
dependencies = ["rag-common"]

[dependency-groups]
dev = ["pytest>=8.4"]

[tool.uv.sources]
rag-common = { path = "../../libs/common", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/threads"]

[tool.pytest.ini_options]
testpaths = ["tests"]
