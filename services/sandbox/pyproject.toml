[project]
name = "sandbox"
version = "0.1.0"
description = "Locked-down Python runs for Deep search's run_python tool"
requires-python = ">=3.12,<3.13"
# The server needs rag-common only; the rest is what a run may import. duckdb matches ingest's, which writes the
# tables files a run opens.
dependencies = [
    "rag-common",
    "duckdb==2.0.0",
    "numpy==2.5.4",
    "pandas==3.1.1",
    "polars>=1.30",
    "pyarrow>=20",
    "scipy==1.18.1",
    "statsmodels>=0.14.4",
    "openpyxl==3.1.5",
    "matplotlib>=3.10",
]

[dependency-groups]
dev = ["pytest>=8.4"]

[tool.uv.sources]
rag-common = { path = "../../libs/common", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sandbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
