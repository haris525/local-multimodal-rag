[project]
name = "audit"
version = "0.1.0"
description = "Append-only, hash-chained audit log of document and chat activity"
requires-python = ">=3.12,<3.13"
dependencies = ["rag-common"]

[dependency-groups]
dev = ["pytest>=8.4"]

[tool.uv.sources]
rag-common = { path = "../../libs/common", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
