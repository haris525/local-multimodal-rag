[project]
name = "rag-eval"
version = "0.1.0"
description = "Golden-set generation, retrieval ablations (MRR, Recall, nDCG) and answer-quality judging"
requires-python = ">=3.12,<3.13"
dependencies = ["httpx>=0.28", "numpy>=2.3", "rag-common"]  # rag-common: the chat stream reader

[project.scripts]
rag-eval = "rag_eval.cli:main"

[dependency-groups]
dev = ["pytest>=8.4"]

[tool.uv.sources]
rag-common = { path = "../libs/common", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
